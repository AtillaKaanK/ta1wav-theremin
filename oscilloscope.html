<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TA1WAV // RF OSCILLOSCOPE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #040604;
      font-family: 'Courier New', Courier, monospace;
    }

    /* CRT Glass Curvature, Scanlines & Vignette */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.42) 0px,
          rgba(0, 0, 0, 0.42) 1px,
          transparent 1px,
          transparent 3px
        ),
        radial-gradient(
          circle at 50% 50%,
          transparent 48%,
          rgba(0, 0, 0, 0.55) 75%,
          rgba(0, 0, 0, 0.94) 100%
        );
      pointer-events: none;
      z-index: 10;
    }

    /* CRT Screen Outer Bezel */
    body::after {
      content: "";
      position: fixed;
      inset: 4px;
      border: 1px solid rgba(110, 165, 110, 0.28);
      pointer-events: none;
      z-index: 11;
    }

    .scope-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Graticule Grid (Vintage Oscilloscope 8x10 divisions) */
    .graticule {
      position: absolute;
      inset: 12px;
      background-size: 10% 12.5%;
      background-image:
        linear-gradient(to right, rgba(110, 165, 110, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(110, 165, 110, 0.08) 1px, transparent 1px);
      border: 1px solid rgba(110, 165, 110, 0.18);
      pointer-events: none;
      z-index: 2;
    }

    /* Center Axes with Sub-division Tick Marks */
    .axis-h {
      position: absolute;
      top: 50%;
      left: 12px;
      right: 12px;
      height: 1px;
      background: rgba(130, 195, 130, 0.22);
      pointer-events: none;
      z-index: 2;
    }

    .axis-v {
      position: absolute;
      left: 50%;
      top: 12px;
      bottom: 12px;
      width: 1px;
      background: rgba(130, 195, 130, 0.22);
      pointer-events: none;
      z-index: 2;
    }

    /* Waveform Viewport */
    .wave-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      z-index: 3;
    }

    .wave-strip {
      display: flex;
      width: 200%;
      height: 100%;
      animation: waveScroll 2.8s linear infinite;
      will-change: transform;
    }

    .wave-strip.secondary {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0.35;
      filter: blur(2px);
      animation: waveScrollGhost 2.85s linear infinite;
    }

    .wave-svg {
      width: 50%;
      height: 100%;
      flex-shrink: 0;
    }

    /* Realistic Phosphor Green Wave Traces */
    .sine-trace {
      fill: none;
      stroke: #aaffaa;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 4px #7ab87a) drop-shadow(0 0 10px rgba(110, 190, 110, 0.45));
    }

    .sine-ghost {
      fill: none;
      stroke: #5a9e5a;
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.55;
      filter: drop-shadow(0 0 12px #407840);
    }

    /* Continuous Seamless Wave Motion */
    @keyframes waveScroll {
      0% {
        transform: translate3d(0, 0, 0);
      }
      100% {
        transform: translate3d(-50%, 0, 0);
      }
    }

    @keyframes waveScrollGhost {
      0% {
        transform: translate3d(-2px, 0, 0);
      }
      100% {
        transform: translate3d(calc(-50% - 2px), 0, 0);
      }
    }

    /* Subtle Trigger Sweep Flicker */
    .flicker-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      animation: crtFlicker 0.18s infinite;
      background: transparent;
    }

    @keyframes crtFlicker {
      0% { opacity: 0.98; }
      50% { opacity: 1; }
      100% { opacity: 0.97; }
    }

    /* Vintage Telemetry Readout */
    .scope-telemetry {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: rgba(130, 195, 130, 0.75);
      text-shadow: 0 0 5px rgba(110, 180, 110, 0.4);
      z-index: 6;
      pointer-events: none;
    }

    .scope-bottom-readout {
      position: absolute;
      bottom: 14px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 9px;
      letter-spacing: 1px;
      color: rgba(100, 155, 100, 0.65);
      z-index: 6;
      pointer-events: none;
    }

    .status-dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #7ab87a;
      box-shadow: 0 0 6px #7ab87a;
      margin-right: 5px;
      animation: pulseDot 1.4s ease-in-out infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="scope-container">

    <!-- OSCILLOSCOPE TOP TELEMETRY -->
    <div class="scope-telemetry">
      <div><span class="status-dot"></span>TA1WAV // RF OSCILLOSCOPE</div>
      <div>144.000 MHz</div>
    </div>

    <!-- GRATICULE (GRID & AXES) -->
    <div class="graticule"></div>
    <div class="axis-h"></div>
    <div class="axis-v"></div>

    <!-- CONTINUOUS PHOSPHOR SINE WAVE LAYER (100% Pure CSS / SVG) -->
    <div class="wave-viewport">
      
      <!-- Ghost Persistence Layer (Vintage P7 Phosphor Afterglow) -->
      <div class="wave-strip secondary">
        <svg class="wave-svg" viewBox="0 0 800 120" preserveAspectRatio="none">
          <path class="sine-ghost" d="
            M 0,60
            C 20,20 40,20 60,60
            C 80,100 100,100 120,60
            C 140,20 160,20 180,60
            C 200,100 220,100 240,60
            C 260,20 280,20 300,60
            C 320,100 340,100 360,60
            C 380,20 400,20 420,60
            C 440,100 460,100 480,60
            C 500,20 520,20 540,60
            C 560,100 580,100 600,60
            C 620,20 640,20 660,60
            C 680,100 700,100 720,60
            C 740,20 760,20 780,60
            C 800,100 820,100 840,60
          " />
        </svg>
        <svg class="wave-svg" viewBox="0 0 800 120" preserveAspectRatio="none">
          <path class="sine-ghost" d="
            M 0,60
            C 20,20 40,20 60,60
            C 80,100 100,100 120,60
            C 140,20 160,20 180,60
            C 200,100 220,100 240,60
            C 260,20 280,20 300,60
            C 320,100 340,100 360,60
            C 380,20 400,20 420,60
            C 440,100 460,100 480,60
            C 500,20 520,20 540,60
            C 560,100 580,100 600,60
            C 620,20 640,20 660,60
            C 680,100 700,100 720,60
            C 740,20 760,20 780,60
            C 800,100 820,100 840,60
          " />
        </svg>
      </div>

      <!-- Main Live Phosphor Beam -->
      <div class="wave-strip">
        <svg class="wave-svg" viewBox="0 0 800 120" preserveAspectRatio="none">
          <path class="sine-trace" d="
            M 0,60
            C 20,20 40,20 60,60
            C 80,100 100,100 120,60
            C 140,20 160,20 180,60
            C 200,100 220,100 240,60
            C 260,20 280,20 300,60
            C 320,100 340,100 360,60
            C 380,20 400,20 420,60
            C 440,100 460,100 480,60
            C 500,20 520,20 540,60
            C 560,100 580,100 600,60
            C 620,20 640,20 660,60
            C 680,100 700,100 720,60
            C 740,20 760,20 780,60
            C 800,100 820,100 840,60
          " />
        </svg>
        <svg class="wave-svg" viewBox="0 0 800 120" preserveAspectRatio="none">
          <path class="sine-trace" d="
            M 0,60
            C 20,20 40,20 60,60
            C 80,100 100,100 120,60
            C 140,20 160,20 180,60
            C 200,100 220,100 240,60
            C 260,20 280,20 300,60
            C 320,100 340,100 360,60
            C 380,20 400,20 420,60
            C 440,100 460,100 480,60
            C 500,20 520,20 540,60
            C 560,100 580,100 600,60
            C 620,20 640,20 660,60
            C 680,100 700,100 720,60
            C 740,20 760,20 780,60
            C 800,100 820,100 840,60
          " />
        </svg>
      </div>

    </div>

    <!-- SUBTLE CRT FLICKER -->
    <div class="flicker-overlay"></div>

    <!-- BOTTOM TELEMETRY -->
    <div class="scope-bottom-readout">
      <span>TIME: 1ms/DIV</span>
      <span>VOLT: 0.5V/DIV</span>
      <span>TRIG: AUTO</span>
    </div>

  </div>

</body>
</html>
