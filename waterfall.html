<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TA1WAV</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020402;
    }

    /* Vintage CRT Scanlines & Heavy Vignette */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.45) 0px,
          rgba(0, 0, 0, 0.45) 1px,
          transparent 1px,
          transparent 3px
        ),
        radial-gradient(
          circle at 50% 50%,
          transparent 50%,
          rgba(0, 0, 0, 0.6) 78%,
          rgba(0, 0, 0, 0.96) 100%
        );
      pointer-events: none;
      z-index: 10;
    }

    /* CRT Outer Glass Bezel */
    body::after {
      content: "";
      position: fixed;
      inset: 4px;
      border: 1px solid rgba(90, 150, 90, 0.28);
      pointer-events: none;
      z-index: 11;
    }

    .crt-monitor {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top RF Spectrum Scope (Upper ~38%) */
    .spectrum-panel {
      position: relative;
      height: 38%;
      width: 100%;
      border-bottom: 1px solid rgba(110, 175, 110, 0.28);
      overflow: hidden;
      background: rgba(3, 7, 3, 0.95);
    }

    /* Faint Graticule Grid Lines */
    .spectrum-grid {
      position: absolute;
      inset: 0;
      background-size: 10% 25%;
      background-image:
        linear-gradient(to right, rgba(110, 175, 110, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(110, 175, 110, 0.06) 1px, transparent 1px);
      pointer-events: none;
    }

    .spectrum-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .fft-trace-1 {
      fill: none;
      stroke: #8cf08c;
      stroke-width: 1.8;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 5px #7ab87a);
      animation: fftJitter1 0.24s infinite alternate;
    }

    .fft-trace-2 {
      fill: none;
      stroke: #48a048;
      stroke-width: 1.4;
      stroke-linejoin: round;
      opacity: 0.55;
      animation: fftJitter2 0.32s infinite alternate;
    }

    .fft-fill {
      fill: url(#spectrumFill);
      stroke: none;
      opacity: 0.35;
    }

    @keyframes fftJitter1 {
      0% { opacity: 0.85; transform: scaleY(0.97); }
      100% { opacity: 1; transform: scaleY(1.03); }
    }

    @keyframes fftJitter2 {
      0% { opacity: 0.4; transform: scaleY(1.04); }
      100% { opacity: 0.65; transform: scaleY(0.96); }
    }

    /* Bottom Cascading Waterfall (Lower ~62%) */
    .waterfall-panel {
      position: relative;
      height: 62%;
      width: 100%;
      overflow: hidden;
      background: #020402;
    }

    .waterfall-grid {
      position: absolute;
      inset: 0;
      background-size: 10% 100%;
      background-image: linear-gradient(to right, rgba(110, 175, 110, 0.05) 1px, transparent 1px);
      pointer-events: none;
      z-index: 2;
    }

    .waterfall-scroll-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 200%;
      display: flex;
      flex-direction: column;
      animation: waterfallFlow 4.6s linear infinite;
      will-change: transform;
    }

    .waterfall-chunk {
      width: 100%;
      height: 50%;
      flex-shrink: 0;
    }

    @keyframes waterfallFlow {
      0% { transform: translate3d(0, -50%, 0); }
      100% { transform: translate3d(0, 0%, 0); }
    }

    /* Subtle CRT Flicker */
    .flicker {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      animation: tubeFlicker 0.16s infinite;
    }

    @keyframes tubeFlicker {
      0% { opacity: 0.98; }
      50% { opacity: 1; }
      100% { opacity: 0.97; }
    }
  </style>
</head>
