<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TA1WAV Theremin</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #040604;
      font-family: 'Courier New', Courier, monospace;
      touch-action: none;
      cursor: crosshair;
    }

    /* CRT Scanlines & Heavy Vignette */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.42) 0px,
          rgba(0, 0, 0, 0.42) 1px,
          transparent 1px,
          transparent 3px
        ),
        radial-gradient(
          circle at 50% 50%,
          transparent 45%,
          rgba(0, 0, 0, 0.6) 75%,
          rgba(0, 0, 0, 0.94) 100%
        );
      pointer-events: none;
      z-index: 10;
    }

    /* CRT Screen Bezel */
    body::after {
      content: "";
      position: fixed;
      inset: 5px;
      border: 1px solid rgba(110, 165, 110, 0.26);
      pointer-events: none;
      z-index: 11;
    }

    .crt-link {
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
      color: inherit;
      position: relative;
    }

    /* PURE CSS VECTOR UNIVERSE (Runs 100% with JS disabled in QRZ Sandbox) */
    .css-system {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 2;
      pointer-events: auto;
    }

    .crt-center-axis {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .crt-center-axis::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(90, 140, 90, 0.12);
    }

    .crt-center-axis::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(90, 140, 90, 0.12);
    }

    .center-emitter {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 14px;
      height: 14px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .center-emitter::before {
      content: "";
      position: absolute;
      top: 6px;
      left: -2px;
      width: 18px;
      height: 2px;
      background: #a0eba0;
      box-shadow: 0 0 6px #7ab87a;
    }

    .center-emitter::after {
      content: "";
      position: absolute;
      left: 6px;
      top: -2px;
      width: 2px;
      height: 18px;
      background: #a0eba0;
      box-shadow: 0 0 6px #7ab87a;
    }

    .gravity-core {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 28px;
      height: 28px;
      border: 1px solid rgba(160, 235, 160, 0.65);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: pulseCore 2.6s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(110, 175, 110, 0.22);
    }

    @keyframes pulseCore {
      0%, 100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1.35); opacity: 0.9; }
    }

    /* CSS Orbit Rings & Phosphor Cross Stars */
    .orbit-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      border: 1px dashed rgba(110, 175, 110, 0.14);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .orbit-ring::after {
      content: "+";
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      color: #b0f5b0;
      font-size: 14px;
      font-weight: bold;
      text-shadow: 0 0 6px #7ab87a;
      line-height: 1;
    }

    .o1 { width: 72px;  height: 72px;  animation: spinCW 5.2s linear infinite; }
    .o2 { width: 126px; height: 114px; animation: spinCCW 8.6s linear infinite; }
    .o3 { width: 188px; height: 174px; animation: spinCW 13.0s linear infinite; }
    .o4 { width: 254px; height: 230px; animation: spinCCW 18.5s linear infinite; }
    .o5 { width: 330px; height: 290px; animation: spinCW 25.0s linear infinite; }
    .o6 { width: 416px; height: 360px; animation: spinCCW 33.2s linear infinite; }
    .o7 { width: 510px; height: 430px; animation: spinCW 42.0s linear infinite; }
    .o8 { width: 610px; height: 500px; animation: spinCCW 52.0s linear infinite; }

    @keyframes spinCW {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes spinCCW {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(-360deg); }
    }

    /* Background static stars */
    .bg-star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(110, 165, 110, 0.45);
      border-radius: 1px;
    }

    /* Interactive Banner Prompt */
    .crt-prompt {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }

    .prompt-box {
      display: inline-block;
      padding: 7px 18px;
      background: rgba(4, 6, 4, 0.88);
      border: 1px solid rgba(122, 184, 122, 0.55);
      border-radius: 4px;
      color: #9fe29f;
      font-size: 11px;
      letter-spacing: 2px;
      text-shadow: 0 0 7px rgba(110, 180, 110, 0.45);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
      animation: promptGlow 2.4s ease-in-out infinite;
    }

    .prompt-sub {
      display: block;
      margin-top: 4px;
      font-size: 9px;
      color: #659a65;
      letter-spacing: 1px;
    }

    @keyframes promptGlow {
      0%, 100% {
        border-color: rgba(122, 184, 122, 0.75);
        box-shadow: 0 0 16px rgba(110, 180, 110, 0.25);
      }
      50% {
        border-color: rgba(122, 184, 122, 0.3);
        box-shadow: 0 0 6px rgba(110, 180, 110, 0.08);
      }
    }

    /* Dynamic Canvas (takes over when JS is active) */
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none; /* Shown via JS */
      z-index: 3;
      filter: contrast(1.15) brightness(0.95);
    }
  </style>
</head>
<body>

  <a href="https://atillakaank.github.io/ta1wav-theremin/" target="_blank" id="crt-link" class="crt-link" title="TA1WAV Theremin — Click to Play">

    <!-- PURE CSS VECTOR ANIMATION (Runs 100% in QRZ.com Sandboxed Iframe) -->
    <div id="css-system" class="css-system">
      <div class="crt-center-axis"></div>
      <div class="gravity-core"></div>
      <div class="center-emitter"></div>

      <!-- Orbiting Stars -->
      <div class="orbit-ring o1"></div>
      <div class="orbit-ring o2"></div>
      <div class="orbit-ring o3"></div>
      <div class="orbit-ring o4"></div>
      <div class="orbit-ring o5"></div>
      <div class="orbit-ring o6"></div>
      <div class="orbit-ring o7"></div>
      <div class="orbit-ring o8"></div>

      <!-- Static background pixel stars -->
      <div class="bg-star" style="top: 18%; left: 24%;"></div>
      <div class="bg-star" style="top: 32%; left: 78%;"></div>
      <div class="bg-star" style="top: 72%; left: 15%;"></div>
      <div class="bg-star" style="top: 84%; left: 66%;"></div>
      <div class="bg-star" style="top: 14%; left: 62%;"></div>
      <div class="bg-star" style="top: 65%; left: 88%;"></div>
      <div class="bg-star" style="top: 48%; left: 11%;"></div>

      <!-- Center Action Prompt -->
      <div class="crt-prompt" id="crt-prompt">
        <div class="prompt-box">
          TA1WAV Theremin
          <span class="prompt-sub">CLICK TO PLAY</span>
        </div>
      </div>
    </div>

    <!-- Live Audio-Reactive Canvas (Active in full tab where JS is enabled) -->
    <canvas id="canvas"></canvas>

  </a>

  <script>
    // DETECT JAVASCRIPT ENVIRONMENT
    // If JS is running (direct tab or unrestricted context), activate live Web Audio Synth
    const isIframe = (window.self !== window.top);

    // If we are in direct tab, hide the static CSS prompt and let Canvas run!
    const crtLink = document.getElementById('crt-link');
    const canvas = document.getElementById('canvas');
    const cssSystem = document.getElementById('css-system');
    const crtPrompt = document.getElementById('crt-prompt');

    if (!isIframe) {
      // In direct browser window: disable redirect, activate canvas & sound
      crtLink.removeAttribute('href');
      crtLink.removeAttribute('target');
      crtLink.style.cursor = 'crosshair';
      canvas.style.display = 'block';
      cssSystem.style.display = 'none';
      startInteractiveSynth();
    } else {
      // In QRZ iframe: If by any chance JS runs inside iframe, still allow clicking to open clean tab
      // but also initialize canvas on user click!
      crtLink.addEventListener('click', (e) => {
        // Let the default link open in a new tab for full audio experience!
      });
    }

    function startInteractiveSynth() {
      const ctx = canvas.getContext('2d');
      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      let audioCtx = null;
      let mainOsc = null;
      let subOsc = null;
      let subGain = null;
      let filterNode = null;
      let masterGain = null;
      let delayNode1 = null;
      let delayNode2 = null;
      let fb1 = null;
      let fb2 = null;
      let reverbGain = null;

      let isActive = false;
      let pointerX = width * 0.5;
      let pointerY = height * 0.5;
      let smoothX = pointerX;
      let smoothY = pointerY;

      const STAR_COUNT = 28;
      const CAPTURE_RADIUS = 165;
      const RELEASE_RADIUS = 235;
      const stars = [];

      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.25,
          vy: (Math.random() - 0.5) * 0.25,
          inOrbit: false,
          angle: Math.random() * Math.PI * 2,
          orbitR: 35 + Math.random() * 95,
          speed: (0.018 + Math.random() * 0.032) * (Math.random() < 0.25 ? -1 : 1),
          weight: 0.6 + Math.random() * 0.8
        });
      }

      function initAudio() {
        try {
          if (audioCtx) {
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            return;
          }

          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;

          audioCtx = new AudioContextClass();

          mainOsc = audioCtx.createOscillator();
          subOsc = audioCtx.createOscillator();
          subGain = audioCtx.createGain();
          filterNode = audioCtx.createBiquadFilter();
          masterGain = audioCtx.createGain();

          delayNode1 = audioCtx.createDelay(1.0);
          delayNode2 = audioCtx.createDelay(1.0);
          fb1 = audioCtx.createGain();
          fb2 = audioCtx.createGain();
          reverbGain = audioCtx.createGain();

          delayNode1.delayTime.value = 0.27;
          delayNode2.delayTime.value = 0.43;
          fb1.gain.value = 0.42;
          fb2.gain.value = 0.38;
          reverbGain.gain.value = 0.38;

          mainOsc.type = 'sine';
          mainOsc.frequency.value = 220;

          subOsc.type = 'sine';
          subOsc.frequency.value = 330;
          subGain.gain.value = 0;

          filterNode.type = 'lowpass';
          filterNode.frequency.value = 1800;

          masterGain.gain.value = 0;

          mainOsc.connect(filterNode);
          subOsc.connect(subGain);
          subGain.connect(filterNode);

          filterNode.connect(masterGain);
          masterGain.connect(audioCtx.destination);

          masterGain.connect(delayNode1);
          delayNode1.connect(fb1);
          fb1.connect(delayNode2);
          delayNode2.connect(fb2);
          fb2.connect(delayNode1);

          delayNode1.connect(reverbGain);
          delayNode2.connect(reverbGain);
          reverbGain.connect(audioCtx.destination);

          mainOsc.start();
          subOsc.start();

          if (audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
          }
        } catch (err) {
          console.warn('Audio init:', err);
        }
      }

      function onDown(e) {
        const rect = canvas.getBoundingClientRect();
        const cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : pointerX);
        const cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : pointerY);
        pointerX = cx - rect.left;
        pointerY = cy - rect.top;
        isActive = true;
        initAudio();
      }

      function onMove(e) {
        const rect = canvas.getBoundingClientRect();
        const cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : pointerX);
        const cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : pointerY);
        pointerX = cx - rect.left;
        pointerY = cy - rect.top;
        if (isActive && audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
      }

      function onUp() {
        isActive = false;
        stars.forEach((s) => {
          if (s.inOrbit) {
            s.inOrbit = false;
            s.vx = -Math.sin(s.angle) * s.speed * s.orbitR * 0.12;
            s.vy = Math.cos(s.angle) * s.speed * s.orbitR * 0.12;
          }
        });
      }

      if (window.PointerEvent) {
        canvas.addEventListener('pointerdown', (e) => {
          try { canvas.setPointerCapture(e.pointerId); } catch(err){}
          onDown(e);
        });
        canvas.addEventListener('pointermove', onMove);
        canvas.addEventListener('pointerup', (e) => {
          try { canvas.releasePointerCapture(e.pointerId); } catch(err){}
          onUp();
        });
        canvas.addEventListener('pointercancel', onUp);
      } else {
        canvas.addEventListener('mousedown', onDown);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);

        canvas.addEventListener('touchstart', (e) => {
          e.preventDefault();
          onDown(e);
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
          e.preventDefault();
          onMove(e);
        }, { passive: false });
        window.addEventListener('touchend', onUp);
      }

      let frame = 0;

      function loop() {
        requestAnimationFrame(loop);
        frame++;

        smoothX += (pointerX - smoothX) * 0.16;
        smoothY += (pointerY - smoothY) * 0.16;

        ctx.fillStyle = 'rgba(4, 6, 4, 0.24)';
        ctx.fillRect(0, 0, width, height);

        if (Math.random() < 0.08) {
          const jy = Math.random() * height;
          ctx.fillStyle = 'rgba(110, 175, 110, 0.03)';
          ctx.fillRect(0, jy, width, 1);
        }

        ctx.strokeStyle = 'rgba(90, 140, 90, 0.08)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, height * 0.5);
        ctx.lineTo(width, height * 0.5);
        ctx.moveTo(width * 0.5, 0);
        ctx.lineTo(width * 0.5, height);
        ctx.stroke();

        let orbitCount = 0;
        let freqModSum = 0;
        let ampModSum = 0;

        for (let i = 0; i < STAR_COUNT; i++) {
          const s = stars[i];
          const dx = s.x - smoothX;
          const dy = s.y - smoothY;
          const dist = Math.hypot(dx, dy);

          if (isActive) {
            if (!s.inOrbit && dist < CAPTURE_RADIUS && orbitCount < 7) {
              s.inOrbit = true;
              s.orbitR = Math.max(28, Math.min(130, dist));
              s.angle = Math.atan2(dy, dx);
            } else if (s.inOrbit && dist > RELEASE_RADIUS) {
              s.inOrbit = false;
            }
          }

          if (s.inOrbit && isActive) {
            orbitCount++;
            const angularStep = s.speed * (75 / s.orbitR);
            s.angle += angularStep;

            const targetX = smoothX + Math.cos(s.angle) * s.orbitR;
            const targetY = smoothY + Math.sin(s.angle) * s.orbitR;

            s.x += (targetX - s.x) * 0.25;
            s.y += (targetY - s.y) * 0.25;

            const radialPull = (1 - s.orbitR / 150);
            freqModSum += Math.sin(s.angle) * (8 + radialPull * 18) * s.weight;
            ampModSum += Math.cos(s.angle) * 0.15 * s.weight;

            ctx.strokeStyle = 'rgba(110, 175, 110, 0.16)';
            ctx.beginPath();
            ctx.moveTo(smoothX, smoothY);
            ctx.lineTo(s.x, s.y);
            ctx.stroke();

            const pulse = (Math.sin(s.angle) + 1) * 0.5;
            ctx.strokeStyle = `rgba(160, 235, 160, ${0.55 + pulse * 0.45})`;
            ctx.beginPath();
            ctx.moveTo(s.x - 4, s.y);
            ctx.lineTo(s.x + 4, s.y);
            ctx.moveTo(s.x, s.y - 4);
            ctx.lineTo(s.x, s.y + 4);
            ctx.stroke();
          } else {
            s.x += s.vx;
            s.y += s.vy;

            s.vx *= 0.992;
            s.vy *= 0.992;
            if (Math.hypot(s.vx, s.vy) < 0.12) {
              s.vx += (Math.random() - 0.5) * 0.04;
              s.vy += (Math.random() - 0.5) * 0.04;
            }

            if (s.x < 0) s.x = width;
            if (s.x > width) s.x = 0;
            if (s.y < 0) s.y = height;
            if (s.y > height) s.y = 0;

            ctx.fillStyle = 'rgba(115, 170, 115, 0.48)';
            ctx.fillRect(Math.round(s.x), Math.round(s.y), 2, 2);
          }
        }

        const normX = Math.max(0, Math.min(1, smoothX / width));
        const normY = Math.max(0, Math.min(1, 1 - smoothY / height));

        const baseFreq = 90 + Math.pow(normX, 1.5) * 790;
        const orbitalBend = Math.tanh(freqModSum / 45) * 65;
        const finalFreq = Math.max(55, baseFreq + orbitalBend);

        if (audioCtx) {
          try {
            const now = audioCtx.currentTime;
            mainOsc.frequency.setTargetAtTime(finalFreq, now, 0.03);

            const subFreq = finalFreq * 1.498 - orbitalBend * 0.5;
            subOsc.frequency.setTargetAtTime(Math.max(55, subFreq), now, 0.04);

            if (isActive) {
              const baseVol = 0.06 + normY * 0.28;
              const tremolo = 1 + Math.tanh(ampModSum) * 0.28;
              const finalVol = Math.min(0.42, Math.max(0.03, baseVol * tremolo));
              masterGain.gain.setTargetAtTime(finalVol, now, 0.04);

              const subLevel = Math.min(0.18, orbitCount * 0.032) * (0.5 + 0.5 * Math.sin(frame * 0.05));
              subGain.gain.setTargetAtTime(subLevel, now, 0.06);
            } else {
              masterGain.gain.setTargetAtTime(0, now, 0.08);
              subGain.gain.setTargetAtTime(0, now, 0.08);
            }
          } catch(e) {}
        }

        const px = Math.round(smoothX);
        const py = Math.round(smoothY);

        if (isActive) {
          const wellR = 12 + normY * 18 + Math.sin(frame * 0.12) * 2 + orbitCount * 3;
          ctx.strokeStyle = 'rgba(145, 220, 145, 0.65)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          const segs = 16;
          for (let k = 0; k <= segs; k++) {
            const a = (k / segs) * Math.PI * 2;
            const rx = px + Math.cos(a) * wellR;
            const ry = py + Math.sin(a) * wellR;
            if (k === 0) ctx.moveTo(rx, ry);
            else ctx.lineTo(rx, ry);
          }
          ctx.stroke();

          ctx.strokeStyle = 'rgba(100, 160, 100, 0.12)';
          ctx.beginPath();
          for (let k = 0; k < 24; k += 2) {
            const a1 = (k / 24) * Math.PI * 2 + frame * 0.004;
            const a2 = ((k + 1) / 24) * Math.PI * 2 + frame * 0.004;
            ctx.moveTo(px + Math.cos(a1) * CAPTURE_RADIUS, py + Math.sin(a1) * CAPTURE_RADIUS);
            ctx.lineTo(px + Math.cos(a2) * CAPTURE_RADIUS, py + Math.sin(a2) * CAPTURE_RADIUS);
          }
          ctx.stroke();
        }

        ctx.strokeStyle = isActive ? 'rgba(170, 245, 170, 0.9)' : 'rgba(110, 165, 110, 0.45)';
        ctx.beginPath();
        ctx.moveTo(px - 7, py);
        ctx.lineTo(px + 7, py);
        ctx.moveTo(px, py - 7);
        ctx.lineTo(px, py + 7);
        ctx.stroke();
      }

      loop();
    }
  </script>
</body>
</html>
